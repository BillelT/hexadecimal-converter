<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hexadecimal converter — Billel</title>
  <meta name="description" content="Hexadecimal converter — numeral bases (hex, decimal, octal, binary), UTF-8 text, and a binary file inspector with an xxd-style dump. A tool by Billel." />

  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Hexadecimal converter — Billel" />
  <meta property="og:description" content="Hex / decimal / octal / binary / UTF-8 converter + binary file inspector." />
  <meta property="og:image" content="./og-image.svg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Hexadecimal converter — Billel" />
  <meta name="twitter:description" content="Hex / decimal / octal / binary / UTF-8 converter + binary file inspector." />
  <meta name="twitter:image" content="./og-image.svg" />

  <link rel="stylesheet" href="./token.css" />
  <link rel="stylesheet" href="./components.css" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <main class="app">
    <header class="page-head">
      <h1 class="page-head__title">Hexadecimal converter</h1>
      <button id="resetBtn" class="btn btn-ghost" type="button">Empty</button>
    </header>

    <section class="workspace">
      <div class="dropzone" id="dropzone">
        <input type="file" id="fileInput" class="dropzone__input" />
        <div class="dropzone__inner">
          <span class="dropzone__title">Upload a file</span>
          <span class="dropzone__hint">rom · bin · exe · img</span>
        </div>
      </div>

      <div class="converter">
        <div class="converter__field">
          <label class="converter__label" for="hexInput">Hex · base 16</label>
          <div class="field-inline">
            <div class="converter__control">
              <span class="converter__prefix">0x</span>
              <input id="hexInput" class="input converter__input" type="text" spellcheck="false" autocomplete="off" data-base="16" placeholder="FF" />
            </div>
            <button class="btn btn-ghost" type="button" data-copy="hexInput">Copy</button>
          </div>
        </div>

        <div class="converter__field">
          <label class="converter__label" for="decInput">Decimal · base 10</label>
          <div class="field-inline">
            <input id="decInput" class="input converter__input" type="text" spellcheck="false" autocomplete="off" data-base="10" placeholder="255" />
            <button class="btn btn-ghost" type="button" data-copy="decInput">Copy</button>
          </div>
        </div>

        <div class="converter__field">
          <label class="converter__label" for="octInput">Octal · base 8</label>
          <div class="field-inline">
            <div class="converter__control">
              <span class="converter__prefix">0o</span>
              <input id="octInput" class="input converter__input" type="text" spellcheck="false" autocomplete="off" data-base="8" placeholder="377" />
            </div>
            <button class="btn btn-ghost" type="button" data-copy="octInput">Copy</button>
          </div>
        </div>

        <div class="converter__field">
          <label class="converter__label" for="binInput">Binary · base 2</label>
          <div class="field-inline">
            <div class="converter__control">
              <span class="converter__prefix">0b</span>
              <input id="binInput" class="input converter__input converter__input--mono" type="text" spellcheck="false" autocomplete="off" data-base="2" placeholder="11111111" />
            </div>
            <button class="btn btn-ghost" type="button" data-copy="binInput">Copy</button>
          </div>
        </div>

        <div class="converter__field">
          <label class="converter__label" for="textInput">Text · UTF-8</label>
          <div class="field-inline">
            <input id="textInput" class="input converter__input--text" type="text" spellcheck="false" autocomplete="off" placeholder="Hello" />
            <button class="btn btn-ghost" type="button" data-copy="textInput">Copy</button>
          </div>
        </div>

        <p class="converter__error" id="errorMsg" hidden></p>
      </div>
    </section>

    <section class="file-reader" id="fileView">
      <div class="file-reader__head">
        <div class="file-reader__info">
          <span class="file-reader__name" id="fileName">No file loaded</span>
          <span class="file-reader__size" id="fileSize"></span>
        </div>
        <div class="file-reader__actions">
          <button class="btn btn-ghost" type="button" id="dumpFormat">Reformat</button>
          <button class="btn btn-ghost" type="button" id="dumpCopy">Copy hex</button>
          <button class="btn btn-ghost" type="button" id="dumpDownload">Download</button>
          <button class="btn btn-ghost" type="button" id="dumpClear">Clear</button>
        </div>
      </div>

      <textarea
        class="hex-dump"
        id="hexDump"
        spellcheck="false"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        wrap="off"
        placeholder="Drop a file above to inspect its bytes."
      ></textarea>

      <div class="file-reader__pager" id="filePager" hidden>
        <button class="btn btn-ghost" type="button" id="pagerPrev">←</button>
        <span class="file-reader__pager-status" id="pagerStatus">—</span>
        <button class="btn btn-ghost" type="button" id="pagerNext">→</button>
      </div>
    </section>
  </main>

  <footer class="page-foot">
    <div class="page-foot__inner">
      <span class="page-foot__name">Hex converter</span>
      <div class="page-foot__right">
        <label class="check">
          <span class="switch">
            <input type="checkbox" id="sound-toggle" checked>
            <span class="slider"></span>
          </span>
          sound
        </label>
        <span class="page-foot__credit">
          <a class="text-link" href="https://www.billeltighidet.fr/" target="_blank" rel="noopener" aria-label="Billel">Billel</a>
          ·
          <a class="text-link" href="https://twitter.com/billel_tighidet" target="_blank" rel="noopener noreferrer">@billel_tighidet</a>
        </span>
      </div>
    </div>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
