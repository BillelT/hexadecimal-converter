<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fff9f5"/>

  <!-- Title -->
  <text
    x="80"
    y="245"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="84"
    font-weight="700"
    letter-spacing="-2"
    fill="#120f0d"
  >Hexadecimal</text>
  <text
    x="80"
    y="341"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="84"
    font-weight="700"
    letter-spacing="-2"
    fill="#120f0d"
  >converter</text>

  <!-- Subtitle -->
  <text
    x="80"
    y="396"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="25"
    fill="#3b3735"
  >Numeral base &amp; UTF-8 converter,</text>
  <text
    x="80"
    y="428"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="25"
    fill="#3b3735"
  >plus a binary file inspector.</text>

  <!-- Graphic representation — mini preview of the converter UI itself:
       label, value field, copy action. Sober, mirrors the real layout. -->
  <rect x="700" y="163" width="430" height="304" rx="28" fill="#fff9f5" stroke="#dcd5d0" stroke-width="1.5"/>

  <!-- Row 1 — Hex -->
  <text x="732" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#3b3735">HEX &#183; BASE 16</text>
  <rect x="732" y="219" width="298" height="40" rx="8" fill="#f1edeb" stroke="#dcd5d0" stroke-width="1"/>
  <text x="750" y="245" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#120f0d">0xFF</text>
  <rect x="1042" y="219" width="56" height="40" rx="8" fill="none" stroke="#dcd5d0" stroke-width="1"/>
  <text x="1070" y="244" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#3b3735">Copy</text>

  <!-- Row 2 — Binary -->
  <text x="732" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#3b3735">BINARY &#183; BASE 2</text>
  <rect x="732" y="307" width="298" height="40" rx="8" fill="#f1edeb" stroke="#dcd5d0" stroke-width="1"/>
  <text x="750" y="333" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#120f0d">0b11111111</text>
  <rect x="1042" y="307" width="56" height="40" rx="8" fill="none" stroke="#dcd5d0" stroke-width="1"/>
  <text x="1070" y="332" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#3b3735">Copy</text>

  <!-- Row 3 — Text -->
  <text x="732" y="383" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#3b3735">TEXT &#183; UTF-8</text>
  <rect x="732" y="395" width="298" height="40" rx="8" fill="#f1edeb" stroke="#dcd5d0" stroke-width="1"/>
  <text x="750" y="421" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#120f0d">Hello</text>
  <rect x="1042" y="395" width="56" height="40" rx="8" fill="none" stroke="#f06800" stroke-width="1.5"/>
  <text x="1070" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#f06800">Copy</text>
</svg>
